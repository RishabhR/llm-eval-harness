# Field definitions for the extraction and analysis halves of the eval.
# See README.md for how each value_type is scored.

industry: software_saas

# Operator-specified operational metrics for the chosen industry. Edit this list
# before running the eval; `named_operational_metrics` is graded per-key against
# this exact list of names, so keep names stable across a run's lifetime.
operational_metrics:
  - net_revenue_retention
  - annual_recurring_revenue
  - gross_margin_subscription
  - remaining_performance_obligations

extraction_fields:
  - id: capex
    name: "Capital expenditures, most recent fiscal year"
    where: "Cash flow statement, investing activities"
    value_type: number
    unit: usd_millions

  - id: buybacks
    name: "Share repurchases, most recent fiscal year"
    where: "Cash flow statement, financing activities, or equity note"
    value_type: number
    unit: usd_millions
    zero_if_none: true

  - id: lease_and_offbs_obligations
    name: "Operating lease liabilities plus disclosed purchase/other contractual obligations"
    where: "Lease note, contractual obligations table"
    value_type: dict_numeric
    keys:
      - operating_lease_liability
      - purchase_obligations
    unit: usd_millions
    # `guidance` is injected into prompts that contain <<FIELD_GUIDANCE>>.
    # extraction_v1.txt has no such placeholder, so v1 is unaffected.
    guidance: |
      - operating_lease_liability: the total operating lease liability. Balance
        sheets usually split this into a current and a non-current portion --
        sum both. Do not report only one portion. Exclude finance lease
        liabilities.
      - purchase_obligations: all disclosed purchase and other contractual
        obligations across every future period, not just the portion due within
        the next twelve months. If a maturity table breaks obligations out by
        year with a "thereafter" row, sum the entire table.

  - id: named_operational_metrics
    name: "Operator-specified operational metrics"
    where: "MD&A"
    value_type: dict_numeric
    keys: []  # populated from operational_metrics above at load time
    # These metrics do not share a unit, so the field has no `unit:` key and
    # the per-metric units below are the authoritative ones.
    guidance: |
      These metrics are in different units. Use the unit given per metric below.
      - net_revenue_retention: percentage. 118 means 118%.
      - annual_recurring_revenue: USD millions.
      - gross_margin_subscription: subscription gross margin as a percentage;
        82.7 means 82.7%. If the filing does not state it directly, compute it
        from the consolidated statements of income as
        (subscription revenue - cost of subscription revenue) / subscription revenue.
        Use the subscription (or subscription-and-support) revenue line and its
        matching cost-of-revenue line -- not total revenue and not total cost of
        revenue. A value computed this way from disclosed line items counts as
        disclosed, so report it rather than null.
      - remaining_performance_obligations: USD millions. Report total RPO
        (current plus non-current) unless the filing discloses only one.

analysis_fields:
  - id: business_model_risks
    name: "Risks to the business model"
    asks_for: >
      The 3 most material risks to the company's ability to sustain its current
      business model, each with a direct citation to filing text.

  - id: competitive_threats
    name: "Competitive threats"
    asks_for: >
      The 3 most significant competitive threats named or implied in the filing,
      each with a direct citation.

  - id: profitability_quality
    name: "Quality of reported profitability"
    asks_for: >
      Items that cause reported earnings to differ from underlying economics
      (e.g. SBC, one-off items, capitalisation choices), each with a direct citation.
